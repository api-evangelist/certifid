summary: >-
  CertifID publishes no /.well-known/ documents on its marketing host
  (www.certifid.com, a Webflow site that answers every unknown path with an HTML
  404 shell) and none on its API host (api.certifid.com returns a bare 404 for
  every /.well-known/ path). The only real well-known surface is the Auth0 tenant
  at auth.certifid.com, which serves a full OpenID Connect discovery document plus
  the RFC 8414 OAuth authorization-server metadata and a JWKS. This is the
  authorization server that fronts the CertifID V2 APIs (audience
  https://api.certifid.com).
