findings:
- No security.txt (RFC 9116) is published on any CertifID host.
- No /.well-known/api-catalog (RFC 9727), so the API is not machine-discoverable
    from the domain root.
- No A2A agent card on any host; the only 200s were an SPA catch-all shell.
- The Auth0 discovery document is the single machine-readable identity surface,
    and it is complete - PKCE S256, private_key_jwt, revocation and device-code
    endpoints are all advertised.
