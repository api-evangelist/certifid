cross_cutting_warnings:
- >-
  NO IDEMPOTENCY. The string "idempoten" does not appear anywhere in the specification
  and no operation declares any header parameter. Every create - wiring instruction Send,
  Collect and Confirm, identity verification, account verification, CreateDisbursement
  and CreatePayoffOrder - is a non-idempotent POST that moves money or contacts a real
  person. Reconcile before retrying a timeout; never blind-retry.
- >-
  NO WEBHOOKS AND NO EVENTS. CertifID publishes no consumer event surface and no
  AsyncAPI. Completion is discovered by polling only. The endpoint named
  IdVerificationResultUrlWebhook is an inbound receiver for CertifID's own IDV vendor,
  not a subscription integrators can use.
- >-
  NO DOCUMENTED RATE LIMIT. No 429 is declared on any of the 57 operations and no
  RateLimit or Retry-After header appears. The real ceiling is unknown, so poll
  conservatively with backoff.
- >-
  READS ARE OFTEN POST. The Disbursements, Lenders and Users groups use POST for
  verb-named read operations. Do not assume HTTP-method semantics and do not let caching
  treat them as safe.
- >-
  PAGINATION IS ZERO-BASED AND IN THE BODY. zeroBasedPage means page 1 is the second
  page, and because paging parameters travel in the POST body a page is not a
  bookmarkable URL.
- >-
  TWO ERROR ENVELOPES. ASP.NET ProblemDetails (served as application/json, never
  application/problem+json) and a proprietary CertifID Response envelope with an integer
  errors[].code. Only one numeric code (119, Invalid Phone Number) is published. 401, 403
  and 500 carry no schema at all.
- >-
  403 MEANS ENTITLEMENT, NOT AUTH. A 403 documents that the company lacks the product
  (identity verification, PayoffProtectProduct) or that the consumer cannot access that
  resource. Retrying never fixes it.
