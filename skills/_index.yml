operation_id_note: >-
  CertifID's specification assigns an operationId to exactly ONE of its 57 operations
  (CreateIdentityVerification). Every other operation id referenced by these skills comes
  from overlays/certifid-certifid-v2-apis-overlay.yaml, which adds a deterministic,
