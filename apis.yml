apis:
- aid: certifid:certifid-v2-apis
  name: CertifID V2 APIs
  description: Access to CertifID data and functions for 3rd Party Integrations. A
    57-operation REST API covering identity verification, account/bank verification,
    wiring instruction Send/Collect/Confirm flows, disbursements, payoff ordering,
    lender lookup and integration certificates. Secured with OAuth 2.0 authorization
    code flow against Auth0 (auth.certifid.com) with an api.certifid.com audience.
  humanURL: https://api.certifid.com/swagger/index.html
