aid: certifid
name: CertifID
description: CertifID is a wire fraud prevention, identity verification and funds
  protection platform for the real estate closing process, serving title agents, law
  firms, real estate agents, lenders and home buyers and sellers. Its products verify
  the identities of transaction participants, verify business and bank account ownership,
  securely share and confirm wiring instructions, order and verify mortgage payoffs,
  collect earnest money and cash-to-close payments, provide secure eSigning, and insure
  wires against fraud loss. CertifID exposes a public "CertifID V2 APIs" REST surface
  at api.certifid.com for third-party integrations, documented with a live OpenAPI
  3.0.1 definition served from Swagger UI and secured with Auth0-backed OAuth 2.0.
