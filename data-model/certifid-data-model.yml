summary: >-
  Entity-relationship graph for the CertifID V2 APIs, derived from the 111
  component schemas and their $ref links plus id-reference fields. The domain has
  four largely independent product clusters that share only the Company/Location
  tenancy spine: wiring-instruction requests (Send/Collect/Confirm), identity and
  account verification, payoff protection (disbursements), and payoff ordering.
  There is no single top-level "transaction" resource joining them - transactionId
  appears as a field on request models but is never itself an addressable resource.
identifier_style:
  format: >-
    Identifiers are opaque strings (typically GUIDs) with no type prefix. Unlike
    prefixed-id APIs, a CertifID identifier does not carry its own type, so
    requestId, disbursementId, payoffOrderId and quoteId are not distinguishable
    from one another by inspection.
  path_params:
  - requestId
  - id
  - payoffOrderId
  - resourceId
  - disbursementId
  - quoteId
  - locationId
  - abaRoutingNumber
