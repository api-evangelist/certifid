observations:
- >-
  There is no addressable Transaction resource even though transactionId is one of
  the most common id fields in the schemas (9 occurrences). The transaction is a
  concept in the request payloads only.
- >-
  Naming is inconsistent across clusters: the same entity is Disbursement in the
  paths and PayoffProtect in the schemas, and Company/Account/Location overlap
  without a published definition of each.
- >-
  Every customer-facing flow terminates in a PDF Certificate endpoint. The
  certificate, not the JSON resource, is the artifact the business cares about.
- >-
  PayoffOrder is the only entity with a self-referential parent/child relationship
  and the only one carrying an event history.
