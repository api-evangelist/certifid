api_changelog_note: >-
  No dated changelog exists for the CertifID V2 APIs themselves. An integrator
  cannot learn from any public page when an endpoint or field changed. The OpenAPI
  definition at api.certifid.com carries info.version "v1" and is not itself
  versioned or archived.
