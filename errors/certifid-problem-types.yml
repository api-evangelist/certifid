gaps:
- >-
  The ResponseError.code space is an integer enum with exactly one published
  value (119). Integrators cannot branch on business errors because the code
  registry is not published.
- >-
  401, 403 and 500 - the three most-declared error statuses, covering 116 response
  declarations - have no schema, no example and no error body documented.
- >-
  Errors are not served as application/problem+json, so RFC 9457-aware clients
  cannot detect them by media type.
- No error response anywhere in the specification carries an example.
- >-
  No correlation/trace identifier is returned on any error response, so a failed
  call cannot be tied to a support ticket.
