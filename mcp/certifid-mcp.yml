status: candidate
source: openapi/certifid-v2-apis-openapi.json
description: >-
  CertifID operates NO Model Context Protocol server. This artifact is a CANDIDATE tool list that
  API Evangelist derived from the 57 operations in the live CertifID V2 APIs OpenAPI definition.
  It is a design input showing what an MCP server over this API could expose - it is not something
  CertifID publishes, and no type: MCPServer pointer was wired into apis.yml for it, because doing
  so would credit CertifID with an agent surface it does not operate.
probes:
- url: https://mcp.certifid.com/
  result: DNS did not resolve
- url: https://api.certifid.com/mcp
  http_status: 404
  method: GET and JSON-RPC tools/list POST
- url: https://www.certifid.com/mcp
  http_status: 404
probed: '2026-08-09'
server: null
auth_note: >-
  If CertifID were to ship an MCP server, the authorization story is already most of the way there:
  the Auth0 tenant at auth.certifid.com publishes full OIDC and RFC 8414 metadata with PKCE S256.
  The missing piece is RFC 9728 protected-resource metadata at https://api.certifid.com/.well-known/oauth-protected-resource,
  which returned 404 - without it an MCP client cannot discover the authorization server from the
  resource host.
input_schema_note: >-
  Every candidate tool inherits its input schema from the backing OpenAPI operation parameters and
  requestBody. Because 56 of 57 operations carry no operationId, the rest: names below are the deterministic
  ids added by overlays/certifid-certifid-v2-apis-overlay.yaml, not names CertifID publishes.
safety_note: >-
  A majority of these operations move money or bind a real-estate closing - CreateDisbursement, CreatePayoffOrder,
  the WiringInstructions Send/Collect/Confirm flows and the verification creates. None of them is
  idempotent and none accepts an Idempotency-Key, so an MCP client that retries a timed-out call
  risks duplicating a disbursement. Any real server over this API should mark those tools as consequential
  and require confirmation.
