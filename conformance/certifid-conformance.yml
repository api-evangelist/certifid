    url: https://trust.certifid.com/
    platform: Thoropass (formerly Laika)
    http_status: 200
    probed: '2026-08-09'
    machine_readable: false
    note: >-
      The trust center root serves a real Thoropass trust-center application
      (page title "Trust Center", loading the Thoropass trust-center bundle from
      laika-app-prod). Its contents are rendered client-side from an authenticated
      API, and every sub-path including /api/* returns the same HTML shell - a soft
