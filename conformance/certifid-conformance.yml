summary: >-
  CertifID conforms strongly on identity (a complete Auth0 OIDC/OAuth 2.0
  authorization server with public discovery) and publishes a SOC 2 Type II
  attestation on its own blog and a Thoropass-hosted trust center. It conforms
  weakly on API-level web standards: no RFC 9457 problem details, no RFC 9116
  security.txt, no RFC 9727 api-catalog, no RFC 8594 deprecation signalling, and
  no idempotency.
standards:
- id: oauth2
  name: OAuth 2.0 (RFC 6749)
  conforms: true
  evidence: >-
    The OpenAPI declares a single oauth2 securityScheme with an authorizationCode
    flow (authorizationUrl https://auth.certifid.com/authorize, tokenUrl
    https://auth.certifid.com/oauth/token) applied to every operation via a
    top-level security requirement.
  source: openapi/certifid-v2-apis-openapi.json
- id: oidc
  name: OpenID Connect Discovery 1.0
  conforms: true
  evidence: >-
    https://auth.certifid.com/.well-known/openid-configuration returned HTTP 200
    with issuer https://auth.certifid.com/, a jwks_uri, userinfo, revocation,
    device-authorization and backchannel-authentication endpoints, and the standard
    claims set.
  source: well-known/certifid-openid-configuration.json
  probed: '2026-08-09'
- id: rfc8414
  name: OAuth 2.0 Authorization Server Metadata (RFC 8414)
  conforms: true
  evidence: >-
    https://auth.certifid.com/.well-known/oauth-authorization-server returned HTTP
    200 with an identical metadata payload.
  source: well-known/certifid-oauth-authorization-server.json
  probed: '2026-08-09'
- id: rfc7636
  name: PKCE (RFC 7636)
  conforms: true
  evidence: >-
    code_challenge_methods_supported advertises S256 (and plain). Note that the
    Swagger UI configuration on the API host sets
    usePkceWithAuthorizationCodeGrant to false, so the published console does not
    exercise PKCE even though the authorization server supports it.
  source: well-known/certifid-openid-configuration.json
- id: rfc7523
  name: JWT Bearer / private_key_jwt client authentication
  conforms: true
  evidence: >-
    token_endpoint_auth_methods_supported includes private_key_jwt; grant_types
    include urn:ietf:params:oauth:grant-type:jwt-bearer and
