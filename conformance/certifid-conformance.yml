  source: well-known/certifid-openid-configuration.json
- id: openapi
  name: OpenAPI Specification 3.0.1
  conforms: true
  evidence: >-
    A parseable OpenAPI 3.0.1 document with 57 operations and 111 component schemas
    is served at
    https://api.certifid.com/swagger/CertifID%20V2%20APIs/swagger.json and rendered
    by Swagger UI at https://api.certifid.com/swagger/index.html.
  probed: '2026-08-09'
  http_status: 200
  caveats:
  - No servers[] array is declared.
  - 56 of 57 operations lack an operationId.
  - No request or response examples anywhere in the document.
- id: rfc9457
  name: Problem Details for HTTP APIs (RFC 9457 / RFC 7807)
  conforms: false
  evidence: >-
    Error bodies use the ASP.NET Core ProblemDetails SHAPE
    (type/title/status/detail/instance) but are served as application/json,
    text/json and text/plain - never application/problem+json. A second,
    proprietary CertifID Response envelope with an integer errors[].code coexists
    with it, so there is no single error contract.
  source: errors/certifid-problem-types.yml
- id: idempotency
  name: HTTP idempotency keys (draft-ietf-httpapi-idempotency-key-header)
  conforms: false
  evidence: >-
    The string "idempoten" does not appear in the 251KB specification. No operation
