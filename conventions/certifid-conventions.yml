  scheme: oauth2 (authorizationCode flow)
  authorization_url: https://auth.certifid.com/authorize?audience=https://api.certifid.com&connection=CertifID-Users-DB
  token_url: https://auth.certifid.com/oauth/token
  provider: Auth0 (tenant auth.certifid.com)
  audience: https://api.certifid.com
  applied: >-
    A top-level security requirement applies oauth2 to every operation; 54 of 57
    operations additionally declare operation-level scope requirements. Three
    /api/Test/* operations exist, one of which is explicitly named NoAuth.
  detail: authentication/certifid-authentication.yml
  scopes: scopes/certifid-scopes.yml
idempotency:
  supported: false
  evidence: >-
    The string "idempoten" does not appear anywhere in the 251KB specification. No
    Idempotency-Key header parameter is declared on any operation, and no
    operation declares any header parameter at all.
  nearest_equivalent:
    field: externalReferenceId
    where: >-
      Present on the account-verification request and query models
      (ExternalReferenceRequestModel, AccountVerificationsListQuery.externalReferenceId).
    note: >-
      This is a client-supplied correlation key that lets an integrator find their
      own record again - it is NOT an idempotency key. Nothing in the published
      contract states that replaying a create with the same externalReferenceId
      returns the original resource instead of creating a second one.
  risk: >-
    Every money-movement and verification create operation
    (CreateDisbursement, CreatePayoffOrder, WiringInstructions/Send,
    WiringInstructions/Collect, WiringInstructions/Confirm,
    AccountVerifications, IdentityVerification) is a non-idempotent POST. A
    network timeout on any of them is unsafe to retry.
  no_pointer_emitted: >-
    No type Idempotency pointer was wired into apis.yml, because the capability is
    genuinely absent. This is a real gap for CertifID to close, not a cataloguing
    miss.
