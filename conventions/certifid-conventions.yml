summary: >-
  Cross-cutting runtime semantics for the CertifID V2 APIs, derived from the live
  OpenAPI 3.0.1 definition served at api.certifid.com. The API is an ASP.NET Core
  service fronted by Cloudflare and Envoy. It is REST-shaped but strongly
  RPC-flavoured in its newer surfaces: the Disbursements, PayoffOrdering, Lenders
  and Users groups use POST for verb-named read operations
  (POST /api/v1/Disbursements/GetDisbursementById/{id}), while the older
  WiringInstructions, AccountVerifications and Integration groups are
  resource-shaped. Integrators should not assume HTTP-method semantics.
